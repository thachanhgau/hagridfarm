<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../garden-v05/"><title>Hagrid Farm · Kiểm tra ảnh</title><link rel="stylesheet" href="wizard-ui.css?v=24.9.73"><style>
body{margin:0;padding:20px;background:#142620;color:#f5d69a;font:14px/1.5 system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:18px;margin:24px 0 12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.card{margin:0;padding:12px;border:1px solid #735044;background:#231f2e;display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0}.card figcaption{text-align:center;font-size:12px}.visual-slot{position:relative;display:flex;align-items:center;justify-content:center}.visual-slot img{image-rendering:pixelated}button{padding:10px 16px;min-height:44px;color:inherit;background:#24483f;border:1px solid #a57554;border-radius:8px}small{color:#d6d8bf}
</style></head><body><header><h1>Hagrid Farm · Bộ ảnh mới</h1><button id="facing">Xem góc phải</button><small>Dữ liệu mẫu · không kết nối tài khoản</small></header><main id="gallery"></main>
<script src="motion-data.js"></script><script src="level-assets.js?v=24.9.73"></script><script type="module">
import {DB} from './balance-data.mjs?v=24.9.73';
import {el,visualItemIcon,icon} from './ui-utils.mjs?v=24.9.73';
const items=new Map(window.FARM_MOTION.items.map(item=>[item.id,item]));let facing='default';
const nativeRefresh=[['water','Nước tưới'],['boost','Nước phép'],['spring_water','Nước suối thần'],['spring_rain','Mưa suối thần'],['felix_felicis','Phúc Lạc Dược'],['prime_meal','Bữa ăn thượng hạng'],['pen_feast','Tiệc chuồng'],['skele_gro','Thuốc Mọc Xương'],['warm_nest_1','Ổ ấm · mẫu']];
const plotRows=DB.expansions.filter(x=>x.kind==='plot').map(x=>[x.id,'Thửa '+x.id.slice(5)]);
const groups=[['Vật tư & cao cấp · 9 mẫu',nativeRefresh],['Mở rộng thửa · art native',plotRows],['Huy hiệu & kỷ vật · 3 mẫu',[['reward_medal','Huy hiệu'],['reward_trophy','Cúp kỷ vật'],['keepsake_puffskein','Kỷ vật Puffskein']]],['Rào khu nuôi · 6 mẫu',DB.expansions.filter(x=>x.id.startsWith('pen_')).map(x=>[x.id,'Chuồng '+x.id.slice(4)])],['Trang trí · 29 mẫu',DB.decorations.map(x=>[x.id,x.label])],['Công thức · 27 mẫu',DB.recipes.map(x=>['recipe_'+x.id,x.label])],['Sản vật · 12 mẫu',DB.animals.map(x=>['produce_'+x.id,x.produce])],['Cây cấp cao · 8 loài',DB.crops.filter(x=>x.level>100).map(x=>[x.id,x.label])]];
groups.splice(1,0,['Chó ba đầu trắng · 16 khung',Array.from({length:16},(_,i)=>['three-headed-dog',['Lớn lên','Đứng yên','Ăn','Vuốt ve'][Math.floor(i/4)]+' · '+(i%4+1),i])]);
function render(){const target=document.querySelector('#gallery');target.replaceChildren();for(const [label,rows] of groups){const grid=el('section',{class:'gallery','aria-label':label});target.append(el('h2',{text:label}),grid);for(const [id,name,frame] of rows){const kind=id.startsWith('keepsake_')?'keepsake':'';grid.append(el('figure',{class:'card','data-item-id':id},[frame===undefined?visualItemIcon(items,id,{size:88,kind,facing:id.startsWith('decoration-')?facing:'default'}):icon(items,id,frame,88),el('figcaption',{text:name})]));}}}
document.querySelector('#facing').onclick=()=>{facing=facing==='default'?'right':'default';document.querySelector('#facing').textContent=facing==='default'?'Xem góc phải':'Xem góc trái';render();};render();
</script></body></html>
