<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../garden-v05/"><title>V23 · Kiểm tra hình ảnh & chuyển động</title><style>
*{box-sizing:border-box}body{margin:0;background:#172c29;color:#ebecd9;font:15px system-ui}header{position:sticky;top:0;z-index:2;padding:14px 22px;background:#172c29f5;border-bottom:1px solid #6c8468}h1{font-size:21px;margin:0 0 8px}button,select{font:inherit;color:inherit;background:#30493c;border:1px solid #82936c;border-radius:8px;padding:8px;margin:3px;min-height:42px}main{padding:16px}h2{font-size:19px}#actors,#decor,#earned,#forest{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.card{border:1px solid #52644d;border-radius:10px;background:#263c34;overflow:hidden}.card strong{display:block;padding:9px;font-size:13px}canvas{display:block;image-rendering:pixelated;max-width:100%;margin:auto}.card small{display:block;padding:8px;color:#c4ceb2}p{color:#c4ceb2;margin:5px 0}#status{font-size:13px}#scene{width:100%;height:auto;border:1px solid #52644d}a{color:#ffc36b}</style></head><body>
<header><h1>V23 · Phòng kiểm tra chuyển động</h1><p>36 loài · 9 sprite trang trí · 29 vật phẩm lối đi. Đường ngang đánh dấu điểm neo; hai góc dùng cùng nhịp.</p><button id="pause">Tạm dừng</button><button id="step">+100 ms</button><select id="clip" aria-label="Chuyển động"><option value="idle">Đứng nghỉ</option><option value="care">Vuốt ve</option><option value="eat">Ăn</option><option value="growth">4 giai đoạn lớn</option></select><button id="restart">Phát lại</button><label><input id="right" type="checkbox"> Hướng phải</label> <label><input id="reduced" type="checkbox"> Giảm chuyển động</label><p id="status">Đang nạp…</p></header>
<main><h2>Cảnh thật · level 100</h2><canvas id="scene"></canvas><h2>Sinh vật & cây trồng</h2><div id="actors"></div><h2>Trang trí và nhân vật</h2><div id="decor"></div><h2>Vật phẩm lối đi · cùng renderer trong game</h2><div id="earned"></div><h2>Cảnh nền</h2><div id="forest"></div></main>
<script src="motion-data.js"></script><script src="level-assets.js?v=24.9.35"></script><script src="motion-care-data.js?v=24.9.35"></script><script src="motion-idle-data.js?v=24.9.35"></script><script src="scene-data.js?v=24.9.35"></script><script type="module">
import {animationFrameAt,idleFrameAt,decorFrameAt} from './scene-animation.mjs?v=24.9.35';
import {createGarden,drawDecoration,DECORATION_LAYOUT} from './scene-renderer.mjs?v=24.9.35';
import * as E from './progression-engine.mjs';
import {buildHonorGardenSnapshot} from './garden-tour.mjs?v=24.9.35';
const $=id=>document.getElementById(id),imgs=new Map();let time=1000,elapsed=0,paused=false,previous=0,start=1000;
const decor=await(await fetch('decor-assets-manifest.json')).json(),forest=await(await fetch('forest-assets.json')).json();
const files=new Set([...FARM_MOTION.items.flatMap(i=>i.frames.map(f=>f.file)),...decor.items.flatMap(i=>[i.file,...i.frames||[],...i.rightFrames||[]]),...forest.assets.map(a=>a.file),...FARM_SCENE.props.map(a=>a.file)]);
await Promise.all([...files].map(file=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{imgs.set(file,img);resolve()};img.onerror=()=>reject(Error(file));img.src=file})));
const card=(parent,label,w=280,h=230)=>{const d=document.createElement('div');d.className='card';const title=document.createElement('strong');title.textContent=label;const c=document.createElement('canvas');c.width=w;c.height=h;const info=document.createElement('small');d.append(title,c,info);$(parent).append(d);return {c,ctx:c.getContext('2d'),info}};
const actors=FARM_MOTION.items.map(item=>({item,...card('actors',item.label||item.id)}));
const decors=decor.items.map(item=>({item,...card('decor',item.label||item.id,280,280)}));
const earned=Object.entries(DECORATION_LAYOUT).map(([id,spec])=>({id,...card('earned',id+' · '+spec.shape,280,140)}));
for(const item of [...forest.assets,...FARM_SCENE.props]){const {c,ctx,info}=card('forest',item.id,280,250);const im=imgs.get(item.file);const scale=Math.min(1,260/im.width,220/im.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,(c.width-im.width*scale)/2,c.height-im.height*scale,im.width*scale,im.height*scale);info.textContent=item.file;}
const renderer=await createGarden($('scene'),{decorAssets:decor.items});const state=buildHonorGardenSnapshot('tour_charlie',E,Date.now()).state;
const ground=({c,ctx})=>{ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#718262';ctx.fillRect(0,c.height-22,c.width,1)};
const sprite=(entry,asset,flip)=>{const {c,ctx}=entry,img=imgs.get(asset.file);const x=Math.round(c.width/2),y=c.height-22;ctx.save();if(flip){ctx.translate(x*2,0);ctx.scale(-1,1)}ctx.drawImage(img,x-asset.pivotX,y-asset.pivotY);ctx.restore()};
function render(){const clock=$('reduced').checked?0:time,mode=$('clip').value,right=$('right').checked;for(const e of actors){ground(e);const i=e.item,clip=mode==='care'||mode==='eat'?(i.clips[mode]?mode:'action'):mode;const choice=mode==='idle'?{frame:idleFrameAt(i,clock)}:animationFrameAt(i,clip,elapsed,{loop:mode==='growth',reducedMotion:clock===0});const frame=choice?.done?i.clips.idle.frames[0]:choice?.frame??3;sprite(e,i.frames[frame],right);e.info.textContent=`${i.id} · ${mode} · frame ${frame}`;}for(const e of decors){ground(e);const f=decorFrameAt(e.item,clock,{facing:right?'right':'default',seed:e.item.id});sprite(e,{...e.item,file:f.file},right&&!e.item.rightFrames);e.info.textContent=`frame ${f.index} · ${right?'phải':'mặc định'}`;}for(const e of earned){ground(e);drawDecoration(e.ctx,{id:e.id,xy:[140,118],facing:right?'right':'default'},clock);e.info.textContent=right?'Hướng phải':'Mặc định';}renderer.render(state,{clock,animationClock:time,now:Date.now(),creatureFacings:Object.fromEntries(state.creatures.map(c=>[c.species,right?'right':'default'])),eventMode:'event_halloween',decorations:{owned:decor.items.map(d=>d.id),placements:decor.items.slice(0,6).map(d=>d.id)}});$('status').textContent=`Đã tải ${imgs.size} ảnh · ${time.toFixed(0)} ms · ${paused?'Dừng':'Đang phát'}`;}
function restart(){elapsed=0;start=time;if(['care','eat'].includes($('clip').value))for(const cr of state.creatures)renderer.animate($('clip').value,{species:cr.species});render()}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Tiếp tục':'Tạm dừng';render()};$('step').onclick=()=>{paused=true;$('pause').textContent='Tiếp tục';time+=100;elapsed=time-start;render()};$('restart').onclick=restart;$('clip').onchange=restart;$('right').onchange=render;$('reduced').onchange=render;
function tick(t){if(!previous)previous=t;const delta=t-previous;if(delta>=100){previous=t;if(!paused){time+=delta;elapsed=time-start;render()}}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
window.motionReview={renderer,state,actors,decors,earned,files:[...files],render,seek(t){paused=true;time=t;elapsed=t-start;render()}};
</script></body></html>
